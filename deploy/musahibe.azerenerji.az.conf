# Apache reverse proxy — musahibe.azerenerji.az → 127.0.0.1:5000
#
# Quraşdırma:
#   sudo cp /home/musahibe/musahibe/deploy/musahibe.azerenerji.az.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite musahibe.azerenerji.az
#   sudo systemctl reload apache2   # (işləmirsə: sudo systemctl start apache2)

<VirtualHost *:80>
    ServerName musahibe.azerenerji.az

    ProxyPreserveHost On
    ProxyRequests Off

    ProxyPass        / http://127.0.0.1:5000/
    ProxyPassReverse / http://127.0.0.1:5000/

    # Namizəd cavabı uzun ola bilər — AI cavabı 2-3 dəqiqə çəkə bilər
    ProxyTimeout 300

    RequestHeader set X-Forwarded-Proto "http"

    ErrorLog  ${APACHE_LOG_DIR}/musahibe-error.log
    CustomLog ${APACHE_LOG_DIR}/musahibe-access.log combined
</VirtualHost>
