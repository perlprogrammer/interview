# =============================================================================
# AI Müsahibə Platforması — Kubernetes manifesti
#
# Namespace : interview
# Domen     : musahibe.azerenerji.az
#
# DİQQƏT: bu faylda HEÇ BİR credential yoxdur və olmamalıdır.
# Konfiqurasiya (`.env`) ayrıca Secret-dədir — bax k8s/secret.example.yaml
#
# Quraşdırma:
#   1) Secret yaradın (yerli .env faylından — ən sadə yol):
#        kubectl create namespace interview
#        kubectl -n interview create secret generic musahibe-env \
#          --from-file=.env=./.env
#
#      və ya declarative istəyirsinizsə:
#        cp k8s/secret.example.yaml k8s/secret.yaml   # bu fayl .gitignore-dadır
#        # dəyərləri doldurun, sonra:
#        kubectl apply -f k8s/secret.yaml
#
#   2) TLS sertifikatı (istio-system namespace-ində olmalıdır):
#        kubectl -n istio-system create secret tls musahibe-tls \
#          --cert=musahibe.crt --key=musahibe.key
#
#   3) Tətbiqi qurun:
#        kubectl apply -f k8s/musahibe.yaml
#
#   Secret dəyişdikdən sonra pod-ları yenidən başladın:
#        kubectl -n interview rollout restart deployment/musahibe
# =============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: interview
  labels:
    app: musahibe
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: interview
  name: musahibe
  labels:
    app: musahibe
spec:
  replicas: 3
  selector:
    matchLabels:
      app: musahibe
  template:
    metadata:
      labels:
        app: musahibe
    spec:
      # DNS: k8s defolt olaraq ndots:5 qoyur. "api.anthropic.com" 2 nöqtəlidir,
      # ona görə resolver əvvəlcə BÜTÜN search domenlərini sınayır
      # (api.anthropic.com.interview.svc.cluster.local və s.) — hər çağırışa
      # ~10 əlavə DNS sorğusu düşür, CoreDNS yüklənir və aralıq
      # "Temporary failure in name resolution" xətaları yaranır.
      # ndots:1 ilə xarici adlar birbaşa həll olunur.
      dnsConfig:
        options:
        - name: ndots
          value: "1"
      containers:
      - name: musahibe
        image: azerenerjirepo/musahibe:v1.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        volumeMounts:
        # Tətbiq konfiqurasiyanı /app/.env faylından oxuyur
        - name: dot-env
          mountPath: /app/.env
          subPath: .env
          readOnly: true
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
      volumes:
      - name: dot-env
        secret:
          secretName: musahibe-env
          defaultMode: 0400
---
apiVersion: v1
kind: Service
metadata:
  namespace: interview
  name: svc-musahibe
  annotations:
    metallb.universe.tf/address-pool: rufat-pool
spec:
  type: LoadBalancer
  selector:
    app: musahibe
  ports:
  - port: 443
    targetPort: 5000
    protocol: TCP
    # DİQQƏT: ad "http"dir, "https" DEYİL — Istio protokolu port adına görə
    # seçir. Tətbiq 5000-də plain HTTP danışır, TLS-i Gateway sonlandırır.
    name: http
    appProtocol: http
---
apiVersion: networking.istio.io/v1alpha3
kind: Gateway
metadata:
  namespace: interview
  name: musahibe-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - "musahibe.azerenerji.az"
    tls:
      httpsRedirect: true          # http → https yönləndirmə
  - port:
      number: 443
      name: https
      protocol: HTTPS
    hosts:
    - "musahibe.azerenerji.az"
    tls:
      mode: SIMPLE
      credentialName: musahibe-tls  # istio-system namespace-indəki TLS secret
---
apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  namespace: interview
  name: musahibe-vs
spec:
  hosts:
  - "musahibe.azerenerji.az"
  gateways:
  - musahibe-gateway
  http:
  - route:
    - destination:
        host: svc-musahibe
        port:
          number: 443
    # AI cavabı və hesabat generasiyası uzun çəkə bilər
    timeout: 300s
