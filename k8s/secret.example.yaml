# =============================================================================
# Tətbiqin konfiqurasiyası (credentiallar daxil) — Kubernetes Secret
#
# Bu fayl NÜMUNƏDİR. Real dəyərlərlə variantı belə hazırlayın:
#
#     cp k8s/secret.example.yaml k8s/secret.yaml
#     # dəyərləri doldurun
#     kubectl apply -f k8s/secret.yaml
#
# `k8s/secret.yaml` .gitignore-dadır — repoya salınmır.
#
# Alternativ (fayl saxlamadan, daha təhlükəsiz): yerli .env-dən birbaşa yaradın
#
#     kubectl -n interview create secret generic musahibe-env \
#       --from-file=.env=./.env
#
# Secret dəyişdikdən sonra:
#     kubectl -n interview rollout restart deployment/musahibe
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  namespace: interview
  name: musahibe-env
type: Opaque
stringData:
  .env: |
    # ---- Claude API ----
    ANTHROPIC_API_KEY=sk-ant-BURAYA-ACARI-YAZIN
    MODEL=claude-sonnet-5
    REPORT_MODEL=claude-opus-5

    # ---- Veb server ----
    PORT=5000

    # ---- MySQL ----
    DB_HOST=BURAYA-MYSQL-HOST-YAZIN
    DB_PORT=3306
    DB_USER=musahibe_app
    DB_PASSWORD=BURAYA-PAROLU-YAZIN
    DB_NAME=musahibe

    # ---- Müsahibə ----
    QUESTIONS_PER_SKILL=2
    INTERVIEW_MINUTES=15
    SESSION_HOURS=8
